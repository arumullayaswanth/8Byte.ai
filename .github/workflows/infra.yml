name: Infra

on:
  # opened/updated PR -> plan, merged PR -> apply
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]
  # manual button: choose apply or destroy
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: apply
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  # placeholder image, cd.yml swaps the running task def later
  BOOTSTRAP_IMAGE_TAG: bootstrap

jobs:
  plan:
    name: Plan (staging)
    # any open PR activity, but not when it's being closed/merged
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Format check
        run: terraform fmt -check -recursive ../..

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="$ACCOUNT.dkr.ecr.${AWS_REGION}.amazonaws.com/staging:${BOOTSTRAP_IMAGE_TAG}"
          terraform plan -var="container_image=$IMAGE" -var="alert_email=${{ vars.ALERT_EMAIL }}"

  staging:
    name: ${{ github.event.inputs.action == 'destroy' && 'Destroy' || 'Apply' }} (staging)
    # merged PR -> apply, or manual run -> apply/destroy
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: terraform/environments/staging
    steps:
      - uses: actions/checkout@v4

      # DEBUG: print the exact sub claim GitHub is sending, so we can match it
      # in the IAM trust policy. Remove this step once OIDC works.
      - name: Debug OIDC sub claim
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "== decoded token claims =="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref, workflow}' || true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      # a merged PR has no input, so default to apply. only destroy when asked.
      - name: Terraform ${{ github.event.inputs.action || 'apply' }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="$ACCOUNT.dkr.ecr.${AWS_REGION}.amazonaws.com/staging:${BOOTSTRAP_IMAGE_TAG}"
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve \
              -var="container_image=$IMAGE" \
              -var="alert_email=${{ vars.ALERT_EMAIL }}"
          else
            terraform apply -auto-approve \
              -var="container_image=$IMAGE" \
              -var="alert_email=${{ vars.ALERT_EMAIL }}"
          fi

  production:
    name: ${{ github.event.inputs.action == 'destroy' && 'Destroy' || 'Apply' }} (production)
    needs: staging
    runs-on: ubuntu-latest
    # required reviewer on this environment is the manual approval gate
    environment: production
    defaults:
      run:
        working-directory: terraform/environments/production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform ${{ github.event.inputs.action || 'apply' }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="$ACCOUNT.dkr.ecr.${AWS_REGION}.amazonaws.com/production:${BOOTSTRAP_IMAGE_TAG}"
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve \
              -var="container_image=$IMAGE" \
              -var="alert_email=${{ vars.ALERT_EMAIL }}"
          else
            terraform apply -auto-approve \
              -var="container_image=$IMAGE" \
              -var="alert_email=${{ vars.ALERT_EMAIL }}"
          fi
